name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Confirm gcc is available
        run: gcc --version

      - name: Offline structural validation
        run: python3 scripts/validate.py

      - name: Host firmware tests
        run: python3 scripts/test_firmware.py

      - name: Validation non-destructiveness regression (#23/#31)
        run: python3 scripts/test_validate_nondestructive.py

      - name: Analytical checks
        run: python3 scripts/analyze.py

      - name: Release guard must refuse with exit code 2 (no gate may close from desk work)
        run: |
          set +e
          python3 manufacturing/release_guard.py
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "release_guard.py exited $code; expected exit code 2 (intentional REFUSED). 0 would silently approve, and any other nonzero (crash/malformed) must not be treated as a considered refusal." >&2
            exit 1
          fi
          echo "release_guard.py correctly exited 2 (REFUSED); gates remain OPEN."

      - name: Release guard unit tests (#28/#39)
        run: python3 scripts/test_release_guard.py
