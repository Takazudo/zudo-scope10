<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#ede9de"/><text x="48" y="58" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="30" text-anchor="start">SCOPE 10 / P0 ARCHITECTURE</text><text x="48" y="91" fill="#617673" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">Preassembled modules + one factory-populated carrier</text><rect x="48" y="145" width="250" height="145" rx="8" fill="none" stroke="#617673" stroke-width="2"/><text x="66" y="175" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">10 SIGNAL INPUTS</text><text x="66" y="200" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">Bias / limit / filter</text><text x="66" y="225" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">2 buffers per channel</text><text x="66" y="250" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">Six TLV9064 total</text><rect x="365" y="145" width="225" height="145" rx="8" fill="none" stroke="#617673" stroke-width="2"/><text x="383" y="175" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">SIGNAL MUX</text><text x="383" y="200" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">74HC4067 → buffer</text><text x="383" y="225" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">100 Ω / 1 nF</text><text x="383" y="250" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">→ GP26 / ADC0</text><rect x="48" y="345" width="250" height="135" rx="8" fill="none" stroke="#617673" stroke-width="2"/><text x="66" y="375" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">10 TIME + 10 RANGE</text><text x="66" y="400" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">Dedicated physical controls</text><text x="66" y="425" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">Filtered unipolar voltages</text><rect x="365" y="345" width="225" height="135" rx="8" fill="none" stroke="#617673" stroke-width="2"/><text x="383" y="375" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">2 CONTROL MUXES</text><text x="383" y="400" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">TIME → GP27 / ADC1</text><text x="383" y="425" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">RANGE → GP28 / ADC2</text><rect x="665" y="210" width="230" height="205" rx="8" fill="none" stroke="#617673" stroke-width="2"/><text x="683" y="240" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">PICO H</text><text x="683" y="265" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">Factory-installed headers</text><text x="683" y="290" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">Sequential acquisition</text><text x="683" y="315" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">Small-tile rendering</text><text x="683" y="340" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">USB 5 V / programming</text><rect x="960" y="220" width="195" height="185" rx="8" fill="none" stroke="#617673" stroke-width="2"/><text x="978" y="250" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">ONE LCD</text><text x="978" y="275" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">Waveshare 19907</text><text x="978" y="300" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">480 × 320 pixels</text><text x="978" y="325" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">Portrait 2 × 5</text><text x="978" y="350" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">SPI bridge</text><path d="M298,217 L365,217" stroke="#be5f3c" stroke-width="3" fill="none"/><circle cx="365" cy="217" r="4" fill="#be5f3c"/><path d="M298,410 L365,410" stroke="#be5f3c" stroke-width="3" fill="none"/><circle cx="365" cy="410" r="4" fill="#be5f3c"/><path d="M590,217 L665,260" stroke="#be5f3c" stroke-width="3" fill="none"/><circle cx="665" cy="260" r="4" fill="#be5f3c"/><path d="M590,410 L665,365" stroke="#be5f3c" stroke-width="3" fill="none"/><circle cx="665" cy="365" r="4" fill="#be5f3c"/><path d="M895,310 L960,310" stroke="#be5f3c" stroke-width="3" fill="none"/><circle cx="960" cy="310" r="4" fill="#be5f3c"/><text x="48" y="555" fill="#183535" font-family="DejaVu Sans,sans-serif" font-size="20" text-anchor="start">Targets: 10 ksample/s/channel; CV/LFO and low audio. Not simultaneous sampling.</text><text x="48" y="590" fill="#be5f3c" font-family="DejaVu Sans,sans-serif" font-size="18" text-anchor="start">STOP: verify display power straps, exact footprints and factory acceptance before fabrication.</text></svg>